name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: ""

      - name: Install Android SDK packages
        run: android --sdk="$ANDROID_SDK_ROOT" --no-metrics sdk install platform-tools platforms/android-37.0 build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate catalogue
        run: ./gradlew --no-daemon --stacktrace validateCatalogue

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
